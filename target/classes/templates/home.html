<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body>
<div class="shell">
    <div class="app-card">
        <h1>Bem-vindo</h1>
        <p>Você entrou na área do perfil/usuário.</p>

        <div class="actions">
            <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="action-wrap">
                <a class="btn" th:href="@{/admin/usuarios}">Usuários Cadastrados</a>
            </div>

            <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="action-wrap">
                <a class="btn" th:href="@{/register}">Cadastrar Usuário</a>
            </div>

            <a class="btn" th:href="@{/perfil/editar}">Editar Perfil</a>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-danger" type="submit">Sair</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
